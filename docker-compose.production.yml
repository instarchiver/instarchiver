services:
  nextjs:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.instarchiver.net}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://instarchiver.net}
    image: instarchiver_production_nextjs
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - 100.73.60.108:58300:3000
